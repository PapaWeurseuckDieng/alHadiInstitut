server {
    listen 80;
    server_name localhost;

    root /var/www/html/public;
    index index.php index.html;

    # Taille max des uploads (photos élèves, justificatifs, etc.)
    client_max_body_size 20M;

    # Toutes les requêtes passent par index.php (routeur Laravel)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Délégation des fichiers .php à PHP-FPM
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Bloque l'accès direct aux fichiers cachés (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Logs dédiés au projet (utile en cas de debug)
    access_log /var/log/nginx/daara-access.log;
    error_log  /var/log/nginx/daara-error.log;
}