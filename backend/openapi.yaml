        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /eleves/{eleveId}/exemplarite:
    parameters:
      - $ref: '#/components/parameters/StudentId'
    post:
      tags: [Exemplarité]
