      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonthlyExemplariteRequest'
      responses:
        '200':
          description: Évaluation enregistrée et score recalculé
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
