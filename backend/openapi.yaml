      description: >-
        Le serveur vérifie que l'élève est rattaché au tuteur authentifié.
        Un identifiant d'élève non rattaché renvoie 403 sans divulguer ses données.
      responses:
        '200':
          description: Synthèse d'évolution scolaire
          content:
            application/json:
              example:
                data:
                  eleve:
                    id: 81
                    matricule: ELV-2026-000001
                    nom_complet: Moussa Diop
                  annee_scolaire: 2026-2027
                  classe:
                    id: 7
                    nom: Classe A
                  progression:
                    moyenne_periode: 15.5
                    moyenne_periode_precedente: 14.0
                    tendance: en_hausse
                    dernieres_evaluations:
                      - matiere: Lecture
                        note: 16.0
                        sur: 20
                        date: "2026-10-05"
                  comportement:
                    mois: "2026-10"
                    assiduite_ponctualite: 4
                    discipline_comportement: 3
                    proprete_hygiene: 4
                    camaraderie_respect: 4
                    prieres_devotion: 3
                  presences:
                    periode:
                      du: "2026-10-01"
                      au: "2027-09-30"
                    totaux:
                      present: 12
                      absent: 1
                      retard: 2
                      excuse: 0
                    dernieres:
                      - date: "2026-10-05"
                        statut: present
                  activite_hebdomadaire: []
                  mise_a_jour: "2026-10-07T20:00:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  # ---------------------------------------------------------------------------
  # Fiches hebdomadaires : l'oustaz valide, l'administration rouvre
  # ---------------------------------------------------------------------------
  /fiches-hebdomadaires/{ficheId}/valider:
    post:
      tags: [Suivi coranique]
      operationId: validateWeeklySheet
      summary: Valider sa fiche remplie (Oustaz)
      description: >-
        Oustaz uniquement (403 pour l'Admin). La fiche en brouillon, avec au moins un jour
        enregistré, passe à « validee » : elle est figée et compte pour l'Élève du mois.
      parameters:
        - $ref: '#/components/parameters/FicheId'
      responses:
        '200':
          description: Fiche validée (données complètes de la fiche, dont valide_par et valide_at)
          content:
            application/json:
              example:
                message: Fiche hebdomadaire validée.
                data: { id: 12, statut: validee, valide_par: Cheikh Fall, valide_at: '2026-10-14T18:00:00+00:00' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /fiches-hebdomadaires/{ficheId}/demander-modification:
    post:
      tags: [Suivi coranique]
      operationId: requestWeeklySheetChange
      summary: Demander la réouverture d'une fiche validée (Oustaz)
      parameters:
        - $ref: '#/components/parameters/FicheId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                motif: { type: [string, 'null'], maxLength: 255 }
      responses:
        '200':
          description: Demande enregistrée (modification_demandee_at, motif_demande_modification)
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Fiche non validée ou demande déjà en attente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /fiches-hebdomadaires/{ficheId}/autoriser-modification:
    post:
      tags: [Suivi coranique]
      operationId: allowWeeklySheetChange
      summary: Rouvrir une fiche validée (Admin)
      description: La fiche repasse en brouillon ; l'oustaz la corrige puis la valide de nouveau.
      parameters:
        - $ref: '#/components/parameters/FicheId'
      responses:
        '200':
          description: Fiche rouverte (statut brouillon, modification_autorisee_par, modification_autorisee_at)
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ---------------------------------------------------------------------------
  # Administration : tableau de bord, comptes, recherche de tuteurs, photos
  # ---------------------------------------------------------------------------
  /admin/dashboard:
    get:
      tags: [Administration - utilisateurs]
      operationId: getDashboard
      summary: Indicateurs, liste paginée et options des formulaires (Admin)
      parameters:
        - name: section
          in: query
          schema: { type: string, enum: [eleves, classes, users], default: eleves }
        - name: q
          in: query
          schema: { type: string, maxLength: 120 }
        - name: annee
          in: query
          schema: { type: string, pattern: '^\d{4}-\d{4}$' }
        - $ref: '#/components/parameters/IncludeArchived'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: >-
            stats, items, pagination, activites et options (oustazs, classes actives avec
            mensualite et frais_inscription appliqués, modes et mois de paiement, inscriptions sans classe).
            La liste complète des tuteurs n'est plus fournie : utiliser GET /admin/tuteurs.
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/tuteurs:
    get:
      tags: [Administration - utilisateurs]
      operationId: searchTutors
      summary: Rechercher un tuteur actif par prénom, nom ou téléphone (Admin)
      description: >-
        20 résultats au plus. Chaque mot doit se retrouver dans le prénom, le nom ou le numéro.
        « homonyme » signale un autre tuteur actif de même prénom et même nom : le téléphone
        et les enfants rattachés permettent de choisir le bon compte.
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 120 }
        - name: exclure_eleve_id
          in: query
          description: Écarte les tuteurs déjà rattachés à cet élève.
          schema: { type: integer }
      responses:
        '200':
          description: Tuteurs trouvés
          content:
            application/json:
              example:
                data:
                  - id: 24
                    user_id: 35
                    prenom: Moussa
                    nom: Diop
                    telephone: '+221771110001'
                    photo: null
                    enfants: [Ndeye Diop]
                    homonyme: true
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/users/{userId}/photo:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Administration - utilisateurs]
      operationId: updateUserPhoto
      summary: Ajouter ou remplacer la photo d'un compte (multipart, champ photo)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PhotoUpload'
      responses:
        '200':
          description: Photo enregistrée (URL publique)
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/users/{userId}/reset-password:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Administration - utilisateurs]
      operationId: resetUserPassword
      summary: Remettre le mot de passe temporaire « passer » (Admin)
      description: Sessions fermées, changement imposé à la prochaine connexion. Refusé pour son propre compte.
      responses:
        '200':
          description: Mot de passe réinitialisé
        '422':
          $ref: '#/components/responses/ValidationError'

  # ---------------------------------------------------------------------------
  # Élèves : photo, tuteurs, changement de classe, frais d'inscription
  # ---------------------------------------------------------------------------
  /eleves/{eleveId}/photo:
    parameters:
      - $ref: '#/components/parameters/StudentId'
    post:
      tags: [Élèves et inscriptions]
      operationId: updateStudentPhoto
      summary: Ajouter ou remplacer la photo d'un élève (multipart, champ photo)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PhotoUpload'
      responses:
        '200':
          description: Photo enregistrée ; l'URL est construite sur l'adresse de la requête
        '422':
          $ref: '#/components/responses/ValidationError'

  /eleves/{eleveId}/tuteurs:
    parameters:
      - $ref: '#/components/parameters/StudentId'
    post:
      tags: [Élèves et inscriptions]
      operationId: attachTutor
      summary: Rattacher un tuteur existant ou un nouveau compte (mot de passe « passer »)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [existant, creer] }
                tuteur_id: { type: integer, description: 'Requis avec le mode existant.' }
                compte:
                  type: object
                  description: Requis avec le mode creer (nom, prenom, sexe, telephone, adresse).
                lien_parente: { type: [string, 'null'], maxLength: 40 }
                est_responsable_legal: { type: boolean }
                est_payeur: { type: boolean }
      responses:
        '201':
          description: Tuteur rattaché ; renvoie la fiche de l'élève
        '422':
          $ref: '#/components/responses/ValidationError'

  /eleves/{eleveId}/tuteurs/{tuteurId}:
    parameters:
      - $ref: '#/components/parameters/StudentId'
      - name: tuteurId
        in: path
        required: true
        schema: { type: integer }
    patch:
      tags: [Élèves et inscriptions]
      operationId: updateTutorLink
      summary: Modifier le rattachement (lien de parenté, responsable légal, payeur)
      responses:
        '200':
          description: Rattachement modifié

  /eleves/{eleveId}/tuteurs/{tuteurId}/retirer:
    parameters:
      - $ref: '#/components/parameters/StudentId'
      - name: tuteurId
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [Élèves et inscriptions]
      operationId: detachTutor
      summary: Retirer un tuteur (l'élève garde au moins un tuteur ; le compte n'est pas touché)
      responses:
        '200':
          description: Tuteur retiré
        '422':
          $ref: '#/components/responses/ValidationError'

  /inscriptions-annuelles/{inscriptionId}/changer-classe:
    parameters:
      - $ref: '#/components/parameters/InscriptionId'
    post:
      tags: [Élèves et inscriptions]
      operationId: changeClass
      summary: Transférer l'élève dans une autre classe de la même année (ou affecter une inscription sans classe)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [classe_id]
              properties:
                classe_id: { type: integer }
                motif: { type: [string, 'null'], maxLength: 255 }
      responses:
        '200':
          description: Élève transféré
        '422':
          $ref: '#/components/responses/ValidationError'

  /inscriptions-annuelles/{inscriptionId}/frais-inscription:
    parameters:
      - $ref: '#/components/parameters/InscriptionId'
    post:
      tags: [Paiements]
      operationId: collectEnrollmentFees
      summary: Encaisser après coup les frais d'inscription (Admin)
      description: >-
        Le montant n'est jamais saisi : c'est celui fixé pour la classe (frais_inscription de la classe,
        sinon config paiements.frais_inscription_par_defaut). Un reçu INS-AAAA-NNNNNN est émis.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode_paiement]
              properties:
                mode_paiement: { $ref: '#/components/schemas/ModePaiement' }
                date_paiement: { type: string, format: date }
      responses:
        '201':
          description: Reçu des frais d'inscription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recu'
        '422':
          description: Frais déjà réglés, élève sans classe ou aucun montant fixé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /inscriptions-annuelles/{inscriptionId}/recu:
    parameters:
      - $ref: '#/components/parameters/InscriptionId'
    get:
      tags: [Paiements]
      operationId: getEnrollmentFeesReceipt
      summary: Reçu des frais d'inscription (Admin, ou tuteur rattaché à l'élève)
      responses:
        '200':
          description: Reçu (type inscription)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Recu' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Frais pas encore réglés

  # ---------------------------------------------------------------------------
  # Paiements (mensualités), tarifs, rappels WhatsApp
  # ---------------------------------------------------------------------------
  /paiements:
    get:
      tags: [Paiements]
      operationId: listMonthlyPayments
      summary: Situation des élèves pour un mois (Admin)
      parameters:
        - name: mois
          in: query
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
        - name: statut
          in: query
          schema: { type: string, enum: [paye, partiel, impaye] }
        - name: classe_id
          in: query
          schema: { type: integer }
        - name: q
          in: query
          schema: { type: string, maxLength: 120 }
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Indicateurs, lignes (élève, dû, payé, reçus, lien WhatsApp), classes, état des rappels
    post:
      tags: [Paiements]
      operationId: recordMonthlyPayment
      summary: Enregistrer une mensualité reçue au secrétariat (reçu REC-AAAA-NNNNNN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eleve_id, mois, montant, mode_paiement]
              properties:
                eleve_id: { type: integer }
                mois: { type: string, pattern: '^\d{4}-\d{2}$' }
                montant: { type: number, minimum: 1 }
                mode_paiement: { $ref: '#/components/schemas/ModePaiement' }
                date_paiement: { type: string, format: date }
                note: { type: [string, 'null'], maxLength: 255 }
      responses:
        '201':
          description: Paiement enregistré
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Recu' }
        '422':
          $ref: '#/components/responses/ValidationError'

  /paiements/tarifs:
    get:
      tags: [Paiements]
      operationId: getFees
      summary: Mensualité et frais d'inscription de chaque classe de l'année (Admin)
      responses:
        '200':
          description: Tarifs
          content:
            application/json:
              example:
                data:
                  annee_scolaire: 2026-2027
                  defaut: 10000
                  defaut_frais_inscription: 5000
                  devise: FCFA
                  classes:
                    - { id: 7, nom: Halaqa Al-Falah, niveau: Débutant, mensualite: 8000, mensualite_appliquee: 8000, frais_inscription: null, frais_inscription_appliques: 5000 }
    put:
      tags: [Paiements]
      operationId: updateFees
      summary: Modifier les montants des classes (null = montant par défaut ; champ absent = inchangé)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tarifs]
              properties:
                tarifs:
                  type: array
                  items:
                    type: object
                    required: [classe_id]
                    properties:
                      classe_id: { type: integer }
                      mensualite: { type: [number, 'null'], minimum: 0 }
                      frais_inscription: { type: [number, 'null'], minimum: 0 }
      responses:
        '200':
          description: Tarifs enregistrés (les reçus déjà émis ne changent pas)

  /paiements/rappels:
    get:
      tags: [Paiements]
      operationId: listReminders
      summary: Journal détaillé des rappels WhatsApp d'un mois (Admin)
      parameters:
        - name: mois
          in: query
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
        - name: statut
          in: query
          schema: { type: string, enum: [envoye, simule, echec] }
      responses:
        '200':
          description: Rappels (tuteur, téléphone, statut, automatique, envoye_par, message, erreur) et totaux par statut
    post:
      tags: [Paiements]
      operationId: sendReminders
      summary: Envoyer maintenant les rappels du mois aux parents des élèves non à jour (Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mois]
              properties:
                mois: { type: string, pattern: '^\d{4}-\d{2}$' }
      responses:
        '200':
          description: Bilan de l'envoi

  /paiements/{paiementId}/recu:
    parameters:
      - $ref: '#/components/parameters/PaiementId'
    get:
      tags: [Paiements]
      operationId: getMonthlyReceipt
      summary: Reçu d'une mensualité (Admin, ou tuteur rattaché à l'élève)
      responses:
        '200':
          description: Reçu (type mensualite)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Recu' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /paiements/{paiementId}/annuler:
    parameters:
      - $ref: '#/components/parameters/PaiementId'
    post:
      tags: [Paiements]
      operationId: cancelMonthlyReceipt
      summary: Annuler un reçu erroné (motif obligatoire ; le reçu reste visible, marqué annulé)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MotifObligatoire'
      responses:
        '200':
          description: Reçu annulé
        '422':
          $ref: '#/components/responses/ValidationError'

  # ---------------------------------------------------------------------------
  # Dépenses
  # ---------------------------------------------------------------------------
  /depenses:
    get:
      tags: [Dépenses]
      operationId: listExpenses
      summary: Dépenses d'une période, recettes, solde et répartition par catégorie (Admin)
      parameters:
        - name: mois
          in: query
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
        - name: annee_scolaire
          in: query
          schema: { type: string, pattern: '^\d{4}-\d{4}$' }
        - name: statut
          in: query
          schema: { type: string, enum: [en_attente, validee, rejetee] }
        - name: categorie
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string, maxLength: 120 }
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Liste paginée et indicateurs (recettes, total validé, solde, en attente, par catégorie)
    post:
      tags: [Dépenses]
      operationId: createExpense
      summary: Saisir une dépense (statut en_attente)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepenseRequest'
      responses:
        '201':
          description: Dépense enregistrée
        '422':
          $ref: '#/components/responses/ValidationError'

  /depenses/{depenseId}:
    parameters:
      - $ref: '#/components/parameters/DepenseId'
    get:
      tags: [Dépenses]
      operationId: getExpense
      summary: Détail d'une dépense
      responses:
        '200':
          description: Dépense
    patch:
      tags: [Dépenses]
      operationId: updateExpense
      summary: Corriger une dépense en attente (409 si déjà traitée)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepenseRequest'
      responses:
        '200':
          description: Dépense modifiée
        '409':
          $ref: '#/components/responses/Conflict'

  /depenses/{depenseId}/valider:
    parameters:
      - $ref: '#/components/parameters/DepenseId'
    post:
      tags: [Dépenses]
      operationId: validateExpense
      summary: Valider une dépense en attente (comptée dans le solde)
      responses:
        '200':
          description: Dépense validée
        '409':
          $ref: '#/components/responses/Conflict'

  /depenses/{depenseId}/rejeter:
    parameters:
      - $ref: '#/components/parameters/DepenseId'
    post:
      tags: [Dépenses]
      operationId: rejectExpense
      summary: Rejeter une dépense en attente (motif obligatoire)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MotifObligatoire'
      responses:
        '200':
          description: Dépense rejetée
        '409':
          $ref: '#/components/responses/Conflict'

  # ---------------------------------------------------------------------------
  # Diplômes
  # ---------------------------------------------------------------------------
  /diplomes:
    get:
      tags: [Diplômes]
      operationId: listDiplomas
      summary: Diplômes délivrés, recherche et indicateurs (Admin)
      parameters:
        - name: q
          in: query
          description: Élève (nom, prénom, matricule), numéro ou intitulé
          schema: { type: string, maxLength: 120 }
        - name: statut
          in: query
          schema: { type: string, enum: [delivre, annule] }
        - name: annee_scolaire
          in: query
          schema: { type: string, pattern: '^\d{4}-\d{4}$' }
        - name: eleve_id
          in: query
          schema: { type: integer }
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: items (Diplome + élève), pagination, stats (delivres, annee_courante, annules), types, mentions

  /eleves/{eleveId}/diplomes:
    parameters:
      - $ref: '#/components/parameters/StudentId'
    post:
      tags: [Diplômes]
      operationId: deliverDiploma
      summary: Délivrer un diplôme à un élève (numéro DIP-AAAA-NNNNNN, Admin)
      description: Intitulé vide = intitulé par défaut du type. La classe actuelle de l'élève est conservée sur le diplôme.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiplomeRequest'
            example:
              type: hifz_complet
              mention: excellent
              date_obtention: '2026-10-12'
      responses:
        '201':
          description: Diplôme délivré
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: '#/components/schemas/Diplome' }
        '422':
          $ref: '#/components/responses/ValidationError'

  /diplomes/{diplomeId}:
    parameters:
      - $ref: '#/components/parameters/DiplomeId'
    get:
      tags: [Diplômes]
      operationId: getDiploma
      summary: Diplôme à imprimer (Admin, ou tuteur de l'élève tant qu'il n'est pas annulé)
      responses:
        '200':
          description: Diplôme
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Diplome' }
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Diplômes]
      operationId: updateDiploma
      summary: Corriger un diplôme non annulé (le numéro ne change pas)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiplomeRequest'
      responses:
        '200':
          description: Diplôme modifié
        '422':
          $ref: '#/components/responses/ValidationError'

  /diplomes/{diplomeId}/annuler:
    parameters:
      - $ref: '#/components/parameters/DiplomeId'
    post:
      tags: [Diplômes]
      operationId: cancelDiploma
      summary: Annuler un diplôme erroné (motif obligatoire ; jamais supprimé)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MotifObligatoire'
      responses:
        '200':
          description: Diplôme annulé
        '422':
          $ref: '#/components/responses/ValidationError'

  # ---------------------------------------------------------------------------
  # Exemplarité d'une classe, espaces Tuteur et Oustaz
  # ---------------------------------------------------------------------------
  /classes/{classeId}/exemplarite:
    parameters:
      - $ref: '#/components/parameters/ClassId'
    get:
      tags: [Exemplarité]
      operationId: getClassExemplarite
      summary: Élèves de la classe, évaluation du mois et score (Admin, Oustaz de la classe)
      parameters:
        - name: mois
          in: query
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
      responses:
        '200':
          description: criteres, eleves[] (evaluation ou null, score)

  /tuteur/me/eleves:
    get:
      tags: [Espace tuteur]
      operationId: myChildren
      summary: Enfants du tuteur connecté (inscriptions avec classe, diplômes non annulés)
      responses:
        '200':
          description: Enfants

  /tuteur/me/paiements:
    get:
      tags: [Espace tuteur]
      operationId: myMonthlyPayments
      summary: Mensualités de l'année pour chaque enfant (payé, partiel, impayé, à venir)
      responses:
        '200':
          description: Mensualités

  /tuteur/me/recus:
    get:
      tags: [Espace tuteur]
      operationId: myReceipts
      summary: Tous les reçus des enfants (frais d'inscription et mensualités), du plus récent au plus ancien
      description: Le détail de chaque reçu s'obtient avec GET /paiements/{id}/recu ou /inscriptions-annuelles/{id}/recu.
      responses:
        '200':
          description: Reçus
          content:
            application/json:
              example:
                data:
                  total_paye: 15000
                  devise: FCFA
                  recus:
                    - { type: inscription, id: 102, numero_recu: INS-2026-000102, date_paiement: '2026-10-07', libelle: Frais d’inscription 2026-2027, montant: 5000, mode_paiement: especes, annule: false }
                    - { type: mensualite, id: 340, numero_recu: REC-2026-000340, date_paiement: '2026-10-07', mois: '2026-10', libelle: Mensualité de octobre 2026, montant: 10000, mode_paiement: wave, annule: false }

  /oustaz/me/classes:
    get:
      tags: [Espace oustaz]
      operationId: myClasses
      summary: Classes de l'oustaz connecté et leurs élèves (avec photo)
      responses:
        '200':
          description: Classes

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    StudentId:
      name: eleveId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ClassId:
      name: classeId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    FicheId:
      name: ficheId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    InscriptionId:
      name: inscriptionId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    PaiementId:
      name: paiementId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    DepenseId:
      name: depenseId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    DiplomeId:
      name: diplomeId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    IncludeArchived:
      name: include_archived
      in: query
      description: Admin uniquement. Sans true, les ressources archivées sont exclues.
      schema:
        type: boolean
        default: false
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [telephone, password]
      properties:
        telephone:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
          example: "+221771234567"
        password:
          type: string
          minLength: 6
          example: passer
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [new_password, new_password_confirmation]
      properties:
        new_password:
          type: string
          minLength: 6
          not:
            const: passer
          example: monSecret6
        new_password_confirmation:
          type: string
          minLength: 6
          example: monSecret6
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [nom, prenom, telephone, sexe, role]
      properties:
        nom:
          type: string
          minLength: 1
          maxLength: 120
        prenom:
          type: string
          minLength: 1
          maxLength: 120
        telephone:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
        sexe:
          type: string
          enum: [M, F]
        role:
          type: string
          enum: [admin, tuteur, oustaz]
        adresse:
          type: [string, 'null']
          maxLength: 255
        date_naissance:
          type: [string, 'null']
          format: date
        profession:
          type: [string, 'null']
          maxLength: 120
          description: Requis pour un rôle tuteur; interdit pour les autres rôles.
        specialite:
          type: [string, 'null']
          maxLength: 120
          description: Requis pour un rôle oustaz; interdit pour les autres rôles.
    UpdateUserRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        nom:
          type: string
          minLength: 1
          maxLength: 120
        prenom:
          type: string
          minLength: 1
          maxLength: 120
        telephone:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
        sexe:
          type: string
          enum: [M, F]
        role:
          type: string
          enum: [admin, tuteur, oustaz]
        adresse:
          type: [string, 'null']
          maxLength: 255
        date_naissance:
          type: [string, 'null']
          format: date
        profession:
          type: [string, 'null']
          maxLength: 120
        specialite:
          type: [string, 'null']
          maxLength: 120
        is_active:
          type: boolean
    EnrollStudentRequest:
      type: object
      additionalProperties: false
      required: [eleve, classe_id, tuteurs]
      properties:
        eleve:
          type: object
          additionalProperties: false
          required: [nom, prenom, sexe]
          properties:
            nom:
              type: string
              minLength: 1
              maxLength: 120
            prenom:
              type: string
              minLength: 1
              maxLength: 120
            date_naissance:
              type: [string, 'null']
              format: date
            sexe:
              type: string
              enum: [M, F]
            adresse:
              type: [string, 'null']
              maxLength: 255
        classe_id:
          type: integer
          minimum: 1
        inscription:
          type: object
          additionalProperties: false
          properties:
            date_inscription:
              type: string
              format: date
        tuteurs:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [mode]
            properties:
              mode:
                type: string
                enum: [existant, creer]
              tuteur_id:
                type: integer
                minimum: 1
                description: Requis avec le mode existant.
              compte:
                type: object
                description: Requis avec le mode creer.
                required: [nom, prenom, sexe, telephone]
                properties:
                  nom:
                    type: string
                    maxLength: 120
                  prenom:
                    type: string
                    maxLength: 120
                  sexe:
                    type: string
                    enum: [M, F]
                  telephone:
                    type: [string, 'null']
                    pattern: '^\+[1-9][0-9]{7,14}$'
                  adresse:
                    type: [string, 'null']
                    maxLength: 255
              lien_parente:
                type: [string, 'null']
                maxLength: 40
              est_responsable_legal:
                type: boolean
              est_payeur:
                type: boolean
        photo:
          type: string
          format: binary
          description: En multipart/form-data uniquement (JPG, PNG, WEBP, 2 Mo).
        paiement:
          type: [object, 'null']
          description: >-
            Encaissement dans la même transaction. frais_inscription = true encaisse le montant
            fixé pour la classe (reçu INS-… renvoyé dans data.recu_inscription) ; chaque mensualité
            produit un reçu REC-… (data.recus). Un montant numérique pour les frais est refusé.
          required: [mode_paiement]
          properties:
            mode_paiement: { $ref: '#/components/schemas/ModePaiement' }
            date_paiement: { type: string, format: date }
            frais_inscription: { type: boolean }
            mensualites:
              type: array
              maxItems: 10
              items:
                type: object
                required: [mois, montant]
                properties:
                  mois: { type: string, pattern: '^\d{4}-\d{2}$' }
                  montant: { type: number, minimum: 1 }
    UpdateStudentRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        nom:
          type: string
          minLength: 1
          maxLength: 120
        prenom:
          type: string
          minLength: 1
          maxLength: 120
        date_naissance:
          type: [string, 'null']
          format: date
        sexe:
          type: string
          enum: [M, F]
        adresse:
          type: [string, 'null']
          maxLength: 255
    ReenrollStudentRequest:
      type: object
      additionalProperties: false
      required: [eleve_id, classe_id]
      properties:
        eleve_id:
          type: integer
          minimum: 1
        classe_id:
          type: integer
          minimum: 1
    CreateClassRequest:
      type: object
      additionalProperties: false
      required: [nom, niveau, oustaz_id]
      properties:
        nom:
          type: string
          minLength: 1
          maxLength: 120
        niveau:
          type: string
          minLength: 1
          maxLength: 80
        oustaz_id:
          type: integer
          minimum: 1
        mensualite:
          type: [number, 'null']
          minimum: 0
          description: Vide = mensualité par défaut.
        frais_inscription:
          type: [number, 'null']
          minimum: 0
          description: Vide = frais d'inscription par défaut.
    UpdateClassRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        nom:
          type: string
          minLength: 1
          maxLength: 120
        niveau:
          type: string
          minLength: 1
          maxLength: 80
        oustaz_id:
          type: integer
          minimum: 1
        mensualite:
          type: [number, 'null']
          minimum: 0
          description: Vide = mensualité par défaut.
        frais_inscription:
          type: [number, 'null']
          minimum: 0
          description: Vide = frais d'inscription par défaut.
    QuranMarker:
      type: object
      additionalProperties: false
      required: [sourate_debut_id, verset_debut, sourate_fin_id, verset_fin]
      properties:
        sourate_debut_id: { type: integer, minimum: 1, maximum: 114 }
        verset_debut: { type: integer, minimum: 1 }
        sourate_fin_id: { type: integer, minimum: 1, maximum: 114 }
        verset_fin: { type: integer, minimum: 1 }
    CreateWeeklySheetRequest:
      type: object
      required: [eleve_id, date_debut, date_fin, sourate_debut_id, verset_debut, sourate_fin_id, verset_fin]
      properties:
        eleve_id: { type: integer, minimum: 1 }
        date_debut: { type: string, format: date, description: 'Samedi' }
        date_fin: { type: string, format: date, description: 'Vendredi suivant' }
        sourate_debut_id: { type: integer, minimum: 1, maximum: 114 }
        verset_debut: { type: integer, minimum: 1 }
        sourate_fin_id: { type: integer, minimum: 1, maximum: 114 }
        verset_fin: { type: integer, minimum: 1 }
    UpdateWeeklySheetRequest:
      type: object
      minProperties: 1
      properties:
        date_debut: { type: string, format: date }
        date_fin: { type: string, format: date }
        sourate_debut_id: { type: integer, minimum: 1, maximum: 114 }
        verset_debut: { type: integer, minimum: 1 }
        sourate_fin_id: { type: integer, minimum: 1, maximum: 114 }
        verset_fin: { type: integer, minimum: 1 }
    DailyQuranRecordRequest:
      type: object
      properties:
        reperes:
          type: object
          properties:
            D: { oneOf: [{ $ref: '#/components/schemas/QuranMarker' }, { type: 'null' }] }
            J: { oneOf: [{ $ref: '#/components/schemas/QuranMarker' }, { type: 'null' }] }
            M: { oneOf: [{ $ref: '#/components/schemas/QuranMarker' }, { type: 'null' }] }
        qualite_recitation: { type: [integer, 'null'], minimum: 0, maximum: 4 }
    CreatePlanningRequest:
      type: object
      required: [jour, heure_debut, heure_fin, activite]
      properties:
        jour:
          type: string
          enum: [samedi, dimanche, lundi, mardi, mercredi]
        heure_debut: { type: string, pattern: '^\d{2}:\d{2}$' }
        heure_fin: { type: string, pattern: '^\d{2}:\d{2}$' }
        activite: { type: string, maxLength: 120 }
    UpdatePlanningRequest:
      type: object
      minProperties: 1
      properties:
        jour:
          type: string
          enum: [samedi, dimanche, lundi, mardi, mercredi]
        heure_debut: { type: string, pattern: '^\d{2}:\d{2}$' }
        heure_fin: { type: string, pattern: '^\d{2}:\d{2}$' }
        activite: { type: string, maxLength: 120 }
    AttendanceSubmissionRequest:
      type: object
      required: [date_cours, presences]
      properties:
        date_cours: { type: string, format: date }
        presences:
          type: array
          items:
            type: object
            required: [eleve_id, statut]
            properties:
              eleve_id: { type: integer, minimum: 1 }
              statut: { type: string, enum: [present, absent, retard, excuse] }
    MonthlyExemplariteRequest:
      type: object
      required: [mois, assiduite_ponctualite, discipline_comportement, proprete_hygiene, camaraderie_respect, prieres_devotion]
      properties:
        mois: { type: string, pattern: '^\d{4}-\d{2}$' }
        assiduite_ponctualite: { type: integer, minimum: 0, maximum: 4 }
        discipline_comportement: { type: integer, minimum: 0, maximum: 4 }
        proprete_hygiene: { type: integer, minimum: 0, maximum: 4 }
        camaraderie_respect: { type: integer, minimum: 0, maximum: 4 }
        prieres_devotion: { type: integer, minimum: 0, maximum: 4 }
    ArchiveRequest:
      type: object
      additionalProperties: false
      properties:
        motif:
          type: [string, 'null']
          maxLength: 255
    PhotoUpload:
      type: object
      required: [photo]
      properties:
        photo:
          type: string
          format: binary
          description: JPG, PNG ou WEBP, 2 Mo au plus.
    ModePaiement:
      type: string
      enum: [especes, wave, orange_money, virement, cheque]
    MotifObligatoire:
      type: object
      required: [motif]
      properties:
        motif: { type: string, minLength: 3, maxLength: 255 }
    Recu:
      type: object
      description: Reçu imprimable d'une mensualité (REC-…) ou des frais d'inscription (INS-…).
      properties:
        type: { type: string, enum: [mensualite, inscription] }
        id: { type: integer, description: 'Id du paiement (mensualité) ou de l''inscription (frais).' }
        numero_recu: { type: string, example: INS-2026-000102 }
        date_paiement: { type: string, format: date }
        mois: { type: [string, 'null'], description: 'AAAA-MM pour une mensualité, null pour les frais.' }
        libelle: { type: string, example: Frais d’inscription 2026-2027 }
        annee_scolaire: { type: string }
        eleve:
          type: object
          properties:
            id: { type: integer }
            matricule: { type: string }
            nom: { type: string }
            prenom: { type: string }
        classe: { type: [string, 'null'] }
        tuteur: { type: [string, 'null'], description: 'Payeur à prévenir.' }
        montant: { type: number }
        montant_du: { type: number }
        total_paye_mois: { type: number }
        reste: { type: number }
        mode_paiement: { $ref: '#/components/schemas/ModePaiement' }
        encaisse_par: { type: [string, 'null'] }
        devise: { type: string, example: FCFA }
        annule: { type: boolean }
        motif_annulation: { type: [string, 'null'] }
    DepenseRequest:
      type: object
      required: [categorie, montant, date_depense]
      properties:
        categorie: { type: string, description: 'Voir les catégories renvoyées par GET /depenses.' }
        montant: { type: number, minimum: 1 }
        date_depense: { type: string, format: date }
        beneficiaire: { type: [string, 'null'], maxLength: 120 }
        mode_paiement: { $ref: '#/components/schemas/ModePaiement' }
        description: { type: [string, 'null'], maxLength: 1000 }
    DiplomeRequest:
      type: object
      required: [type, date_obtention]
      properties:
        type: { type: string, enum: [hifz_complet, hifz_partiel, fin_cycle, tajwid, autre] }
        intitule: { type: [string, 'null'], maxLength: 160 }
        mention: { type: [string, 'null'], enum: [passable, assez_bien, bien, tres_bien, excellent, null] }
        date_obtention: { type: string, format: date, description: 'Pas dans le futur ; détermine l''année scolaire.' }
        observations: { type: [string, 'null'], maxLength: 1000 }
    Diplome:
      type: object
      properties:
        id: { type: integer }
        numero: { type: string, example: DIP-2026-000004 }
        type: { type: string }
        intitule: { type: string }
        mention: { type: [string, 'null'] }
        date_obtention: { type: string, format: date }
        annee_scolaire: { type: string }
        classe: { type: [string, 'null'] }
        observations: { type: [string, 'null'] }
        annule: { type: boolean }
        eleve:
          type: object
          properties:
            id: { type: integer }
            matricule: { type: string }
            nom: { type: string }
            prenom: { type: string }
            photo: { type: [string, 'null'] }
            date_naissance: { type: [string, 'null'], format: date }
        delivre_par: { type: [string, 'null'] }
        motif_annulation: { type: [string, 'null'] }
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Le numéro de téléphone existe déjà.
    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message:
          type: string
          example: Les données fournies sont invalides.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            sexe: [Le sexe doit être M ou F.]
    ProgressSummary:
      type: object
      properties:
        data:
          type: object
          required: [eleve, annee_scolaire, progression, presences, activite_hebdomadaire]
          properties:
            eleve:
              type: object
              properties:
                id:
                  type: integer
                matricule:
                  type: string
                nom_complet:
                  type: string
            annee_scolaire:
              type: string
              pattern: '^\d{4}-\d{4}$'
            classe:
              type: [object, 'null']
              properties:
                id:
                  type: integer
                nom:
                  type: string
            progression:
              type: object
              properties:
                moyenne_periode:
                  type: [number, 'null']
                moyenne_periode_precedente:
                  type: [number, 'null']
                tendance:
                  type: string
                  enum: [en_hausse, stable, en_baisse, evalue, non_evalue]
                dernieres_evaluations:
                  type: array
                  items:
                    type: object
                    properties:
                      matiere:
                        type: string
                      note:
                        type: number
                      sur:
                        type: number
                      date:
                        type: string
                        format: date
            comportement:
              type: [object, 'null']
              properties:
                mois: { type: string, pattern: '^\d{4}-\d{2}$' }
                assiduite_ponctualite: { type: integer, minimum: 0, maximum: 4 }
                discipline_comportement: { type: integer, minimum: 0, maximum: 4 }
                proprete_hygiene: { type: integer, minimum: 0, maximum: 4 }
                camaraderie_respect: { type: integer, minimum: 0, maximum: 4 }
                prieres_devotion: { type: integer, minimum: 0, maximum: 4 }
            presences:
              type: object
              properties:
                periode:
                  type: object
                  properties:
                    du: { type: string, format: date }
                    au: { type: string, format: date }
                totaux:
                  type: object
                  properties:
                    present: { type: integer }
                    absent: { type: integer }
                    retard: { type: integer }
                    excuse: { type: integer }
                dernieres:
                  type: array
                  items:
                    type: object
                    properties:
                      date: { type: string, format: date }
                      statut: { type: string, enum: [present, absent, retard, excuse] }
            activite_hebdomadaire:
              type: array
              items:
                type: object
                properties:
                  statut: { type: string, enum: [brouillon, validee] }
                  notes:
                    type: array
                    items:
                      type: object
                      properties:
                        qualite_recitation: { type: [integer, 'null'], minimum: 0, maximum: 4 }
            mise_a_jour:
              type: string
              format: date-time
  responses:
    BadRequest:
      description: Requête mal formée ou corps JSON illisible
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Le corps de la requête est mal formé.
    Unauthorized:
      description: Authentification absente ou invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Authentification requise.
    Forbidden:
      description: Rôle insuffisant ou accès refusé
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Vous n'êtes pas autorisé à effectuer cette action.
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: La ressource demandée est introuvable.
    Conflict:
      description: Conflit avec une ressource ou une règle métier
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Une inscription existe déjà pour cette année scolaire.
    ValidationError:
      description: Données invalides
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            message: Les données fournies sont invalides.
            errors:
              telephone:
                - Le numéro de téléphone existe déjà.
    ServerError:
      description: Erreur interne inattendue
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Une erreur interne est survenue. Veuillez réessayer plus tard.
