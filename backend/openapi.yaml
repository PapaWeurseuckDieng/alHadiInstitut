      parameters:
        - name: mois
          in: query
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
      responses:
        '200':
          description: >-
            gagnant (meilleur des meilleurs), classement général, non_classes (avec les composantes
            manquantes), classes[] (moyennes des scores et des composantes, premier de la classe,
            classement interne avec rang_classe, triées par moyenne) et classe_exemplaire.
          content:
            application/json:
              example:
                data:
                  mois: "2026-10"
                  gagnant:
                    score_total: 87.5
                  classement: []
        '403':
